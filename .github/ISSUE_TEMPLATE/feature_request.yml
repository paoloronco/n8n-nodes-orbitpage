name: Feature request
description: Propose a focused OrbitPage workflow capability or UX improvement.
title: 'feature: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: Describe the user goal before proposing a node or operation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include the expected resource, operation, inputs, output, and side effects.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: boundary
    attributes:
      label: Public package boundary
      options:
        - label: This request uses the published OrbitPage workspace API.
          required: true
